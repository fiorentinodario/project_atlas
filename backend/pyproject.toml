[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas-api"
version = "0.1.0"
description = "REST API for the ProjectAtlas knowledge and project management platform."
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4.0",
  "Flask-Cors>=5.0,<7.0",
  "Flask-Migrate>=4.1,<5.0",
  "Flask-SQLAlchemy>=3.1,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=project_atlas --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
