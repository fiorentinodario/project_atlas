name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-compose-secret-not-used-in-production
      JWT_SECRET_KEY: ci-compose-jwt-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
